name: Staging smoke tests

on:
  push:
    branches: [staging]
  workflow_dispatch: {}

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_BASE_URL: https://station-v2-git-staging-yorgoas-projects.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Vercel's preview build for this same push needs a minute or two; poll
      # the (public, unauthenticated) login page's build-version footer until
      # it reports this exact commit, so we never test the previous deploy.
      - name: Wait for the matching staging deployment
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "Waiting for staging to serve commit $SHORT_SHA ..."
          for i in $(seq 1 30); do
            BODY=$(curl -sf -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" \
              "$E2E_BASE_URL/login" || true)
            if echo "$BODY" | grep -q "$SHORT_SHA"; then
              echo "Staging is serving $SHORT_SHA."
              exit 0
            fi
            echo "  attempt $i/30: not yet, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Staging never reported commit $SHORT_SHA after 5 minutes; running smoke tests against whatever is live now."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: e2e
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
          E2E_EMPLOYEE_EMAIL: ${{ secrets.E2E_EMPLOYEE_EMAIL }}
          E2E_EMPLOYEE_PASSWORD: ${{ secrets.E2E_EMPLOYEE_PASSWORD }}
          E2E_COLLECTOR_EMAIL: ${{ secrets.E2E_COLLECTOR_EMAIL }}
          E2E_COLLECTOR_PASSWORD: ${{ secrets.E2E_COLLECTOR_PASSWORD }}
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report
          path: e2e/playwright-report/
          retention-days: 14
